name: bunney_pos_android
description: "Bunney POS — offline Arabic RTL café point-of-sale for Android."
publish_to: 'none'

# Keep in step with AppInfo.version in lib/core/constants.dart.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Storage. sqflite_sqlcipher is a drop-in sqflite replacement that links
  # SQLCipher, so the sales database is encrypted at rest. The key lives in the
  # Android Keystore through flutter_secure_storage — never in the database,
  # never in the source.
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Arabic date and number shaping.
  intl: ^0.19.0

  # Bluetooth (Android 12+) and USB access permissions.
  permission_handler: ^11.4.0

  cupertino_icons: ^1.0.8

# file_picker is deliberately NOT here yet. It is only needed by the phase-4
# backup export, and adding it now breaks the Android build: it declares
# `compileSdk 34` while the flutter_plugin_android_lifecycle 2.0.35 it pulls in
# requires 36, and AGP fails on the mismatch. Adding a dependency a phase before
# its consumer means a build that cannot run for reasons unrelated to the work
# at hand. It goes in with the screen that uses it.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # The Arabic face is bundled rather than fetched: a counter device must render
  # Arabic with no internet, and the OEM font stack differs per device.
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabicUI-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabicUI-Bold.ttf
          weight: 700

  assets:
    - assets/schema/
